# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

components:
  - ../../../components/azure/resources/gpu/1-H100
  - ../../../components/azure/resources/spot
  - ../../../components/storage/vllm/azure/blobfuse
  - ../../../components/storage/vllm/azure/xla-cache
  # - ../../../components/hpa/vllm/token-latency # HPA is a work-in-progress

patches:
  - path: deployment.patch.yaml
    target:
      kind: Deployment
  - options:
      allowNameChange: true
    path: hpa.patch.yaml
    target:
      kind: HorizontalPodAutoscaler
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/command
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - /data/models/$(MODEL_PATH)
          - --served-model-name=$(MODEL_ID)
          - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: MODEL_PATH
            value: vllm_models/llama3-8b-hf
          - name: VLLM_XLA_CACHE_PATH
            value: /data/models
          - name: VLLM_CACHE_ROOT
            value: /data
          - name: VLLM_USE_V1
            value: "1"
          - name: MODEL_ID
            value: meta-llama/Meta-Llama-3-8B
          - name: TENSOR_PARALLEL_SIZE
            value: "1"
    target:
      kind: Deployment
